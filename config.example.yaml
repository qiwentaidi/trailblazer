# Trailblazer SDK/CLI 的安全示例配置。
#
# 使用方式：
#   cp config.example.yaml config.yaml
#   trailblazer -u https://example.com --config config.yaml
#
# config.yaml 只用于本地配置，不要提交真实 API Key、账号或密码。
# SDK 不依赖 Elasticsearch 或 Web 配置；这里仅保留 SDK 扫描需要的字段。

openai:
  enabled: false
  api_key: ""
  base_url: ""
  model: ""

log:
  # 可选：扫描日志文件路径。为空时不接管默认控制台输出。
  output-path: ""

vuln-detection:
  enabled: true
  # 授权检查只执行“带认证基线 vs 匿名请求”的对照实验；不猜测低权限账号。
  authorization:
    enabled: true
  # 各检测模块的 payload/关键词/规则均已内置，这里只保留开关。
  # 高级自定义（追加 payload、规则）仍兼容旧字段，见 pkg/config/options.go。
  sql-injection:
    enabled: true
  lfi:
    enabled: true
  ssrf:
    enabled: true
    # 可选：回连地址（自建 OOB 服务 / interactsh 域名），
    # 设置后额外派发带外探测，命中在回连服务端确认。
    callback-url: ""
  redirect:
    enabled: true
  xss:
    enabled: true
  # 文件上传属于主动写入型探测，示例中默认关闭。
  upload:
    enabled: false
