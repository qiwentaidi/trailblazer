<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: black; }
      .foreground { fill: white; }
      .accent { fill: #ff6b6b; }
      .highlight { fill: #4ecdc4; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: white; }
      .foreground { fill: black; }
      .accent { fill: #ff8e8e; }
      .highlight { fill: #6eddd6; }
    }
  </style>
  <g clip-path="url(#clip0_trailblazer)">
    <rect class="background" width="180" height="180" rx="37" />
    <g style="transform: scale(90%); transform-origin: center">
      <!-- 代码块背景 -->
      <rect class="foreground" x="30" y="40" width="120" height="80" rx="8" opacity="0.1"/>
      
      <!-- JavaScript代码符号 { } - 真正的大括号形状 -->
      <!-- 左大括号 { -->
      <path class="foreground" d="M45 70 Q35 75 45 80 Q35 85 45 90" stroke-width="5" fill="none" stroke="currentColor" stroke-linecap="round"/>
      
      <!-- 右大括号 } -->
      <path class="foreground" d="M135 70 Q145 75 135 80 Q145 85 135 90" stroke-width="5" fill="none" stroke="currentColor" stroke-linecap="round"/>
      
      <!-- API端点线条 -->
      <line class="accent" x1="50" y1="105" x2="130" y2="105" stroke-width="2"/>
      <line class="accent" x1="50" y1="115" x2="130" y2="115" stroke-width="2"/>
      
      <!-- 漏洞检测雷达波 -->
      <circle class="highlight" cx="90" cy="85" r="12" stroke-width="2" fill="none" opacity="0.8"/>
      <circle class="highlight" cx="90" cy="85" r="20" stroke-width="2" fill="none" opacity="0.6"/>
      <circle class="highlight" cx="90" cy="85" r="28" stroke-width="2" fill="none" opacity="0.4"/>
      
      <!-- 扫描指针 -->
      <line class="accent" x1="90" y1="85" x2="115" y2="60" stroke-width="3" stroke-linecap="round"/>
      <circle class="accent" cx="90" cy="85" r="3" fill="currentColor"/>
      
      <!-- 警告标识 -->
      <path class="accent" d="M145 45 L150 55 L140 55 Z" fill="currentColor"/>
      
      <!-- Trailblazer完整文字 -->
      <text class="foreground" x="90" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Trailblazer</text>
      
    </g>
  </g>
  <defs>
    <clipPath id="clip0_trailblazer">
      <rect width="180" height="180" fill="white" />
    </clipPath>
  </defs>
</svg>